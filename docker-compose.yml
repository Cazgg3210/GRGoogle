# ============================================================================
# SMLXL Meeting Intelligence — misma forma que el despliegue en EasyPanel.
#
#   docker compose up -d postgres              # solo base de datos (desarrollo)
#   docker compose --profile full up -d --build # api + web + worker + postgres
# ============================================================================
name: smlxl-meetings

services:
  postgres:
    image: postgres:16-alpine
    container_name: smlxl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smlxl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smlxl_password}
      POSTGRES_DB: ${POSTGRES_DB:-smlxl}
      TZ: America/Mexico_City
    volumes:
      - smlxl_pgdata:/var/lib/postgresql/data
    ports:
      - '${PUERTO_POSTGRES:-5460}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-smlxl} -d ${POSTGRES_DB:-smlxl}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: smlxl_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smlxl}:${POSTGRES_PASSWORD:-smlxl_password}@postgres:5432/${POSTGRES_DB:-smlxl}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${PORT_API:-4000}:4000'
    profiles: ['full']

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: smlxl_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smlxl}:${POSTGRES_PASSWORD:-smlxl_password}@postgres:5432/${POSTGRES_DB:-smlxl}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['full']

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: smlxl_web
    restart: unless-stopped
    env_file: .env
    environment:
      API_URL: http://api:4000
    depends_on:
      - api
    ports:
      - '${PORT_WEB:-3000}:3000'
    profiles: ['full']

volumes:
  smlxl_pgdata:
